name: StayRide Scheduled Sync & Cab Worker

on:
  schedule:
    # Runs every 15 minutes automatically on GitHub Actions (completely free, bypassing Vercel Hobby daily limit)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping StayRide Backend Endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ secrets.PRODUCTION_SERVER_URL || 'https://home-stay-ten.vercel.app' }}
        run: |
          echo "Triggering cab cycle..."
          curl -s -S -X GET "$BASE_URL/api/v1/stayride/cron/cab-cycle" \
            -H "Authorization: Bearer $CRON_SECRET" || echo "Cab cycle ping notice"

          echo "Triggering 1-way iCal OTA sync..."
          curl -s -S -X GET "$BASE_URL/api/v1/stayride/cron/ical-sync" \
            -H "Authorization: Bearer $CRON_SECRET" || echo "iCal sync ping notice"
